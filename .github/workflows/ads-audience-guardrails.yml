name: ADS audience privacy regression checks
on:
  pull_request:
    paths:
      - 'services/analytics/**'
      - '.github/workflows/ads-audience-guardrails.yml'
  push:
    branches:
      - audiencia-taskflow-optin-v1-20261121
    paths:
      - 'services/analytics/**'
      - '.github/workflows/ads-audience-guardrails.yml'
permissions:
  contents: read
jobs:
  sql-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL fixture, idempotent migration and safety checks
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 -f services/analytics/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f services/analytics/audience_v1.sql
          psql -v ON_ERROR_STOP=1 -f services/analytics/audience_v1.sql
          psql -v ON_ERROR_STOP=1 -f services/analytics/tests/assertions.sql
  privacy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audience privacy and consent
        run: node --test services/analytics/tests/guardrails.test.mjs
